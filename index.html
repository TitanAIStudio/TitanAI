<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titan AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <div class="logo">◈ Titan AI</div>
</div>

<div class="container">

    <div class="sidebar">

        <button class="new-chat">
            + New Chat
        </button>

        <div class="chat-list">
            <div class="chat-item">
                Welcome Chat
            </div>
        </div>

    </div>

    <div class="main">

        <div class="messages" id="messages">

            <div class="welcome">
                <h1>◈ Titan AI</h1>
                <p>Your Roblox Development Partner</p>
            </div>

        </div>

        <div class="input-area">

            <input
                id="prompt"
                type="text"
                placeholder="Create a sword system..."
            >

            <button
                class="generate"
                onclick="generateResponse()"
            >
                Generate
            </button>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
